name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows CI
    uses: ./.github/workflows/windows-ci.yml

  linux:
    name: Linux CI
    uses: ./.github/workflows/linux-ci.yml

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [windows, linux]
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: mcr-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath 'dist' -File | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) {
              throw 'No package archives were downloaded.'
          }

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $env:RELEASE_TAG @assets --clobber
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to update package assets for $env:RELEASE_TAG"
              }
              Write-Output "Release $env:RELEASE_TAG already exists; package assets updated"
              exit 0
          }

          $version = $env:RELEASE_TAG.Substring(1)
          $releaseArgs = @(
              'release', 'create', $env:RELEASE_TAG,
              '--verify-tag', '--generate-notes',
              '--title', "mcr $version"
          )
          if (($version -split '\+', 2)[0].Contains('-')) {
              $releaseArgs += '--prerelease'
          }
          $releaseArgs += $assets
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to publish release $env:RELEASE_TAG"
          }
