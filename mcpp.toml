[package]
name = "mcr"
version = "0.3.0"
description = "A modular C++23 HTTP client library built on libcurl, with synchronous, asynchronous, and batch requests"
license = "MIT"

[lib]
path = "src/mcr.cppm"

[build]
cxxflags = ["-Wall", "-Wextra", "-Werror"]

[profile.sanitize]
opt = 1
debug = true
cflags = ["-fsanitize=address,undefined", "-fno-omit-frame-pointer"]
cxxflags = ["-fsanitize=address,undefined", "-fno-omit-frame-pointer"]
ldflags = ["-fsanitize=address,undefined"]

[dependencies.compat]
curl = "8.21.0"

[target.linux.dependencies.compat]
openssl = "3.5.1"

[target.linux.build]
defines = ["MCR_SSL_CTX_OPENSSL"]

[target.macos.dependencies.compat]
openssl = "3.5.1"

[target.macos.build]
defines = ["MCR_SSL_CTX_OPENSSL"]
